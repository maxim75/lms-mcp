services:
  lms-mcp:
    build: .
    restart: unless-stopped
    environment:
      # Where Lyrion Music Server lives. Use the LAN address of the machine
      # running it; localhost inside this container is the container itself.
      LMS_HOST: ${LMS_HOST:-192.168.1.10}
      LMS_PORT: ${LMS_PORT:-9000}
      LMS_PROTOCOL: ${LMS_PROTOCOL:-http}
      LMS_TIMEOUT: ${LMS_TIMEOUT:-10}
      LMS_DEFAULT_PLAYER: ${LMS_DEFAULT_PLAYER:-}
      LMS_ENABLE_DESTRUCTIVE: ${LMS_ENABLE_DESTRUCTIVE:-false}
      # Required: clients must send `Authorization: Bearer <MCP_AUTH_TOKEN>`.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN to a secret value}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9055
      MCP_PATH: ${MCP_PATH:-/mcp}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${MCP_PUBLISHED_PORT:-9055}:9055"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:9055/health", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
