[project]
name = "lms-mcp"
version = "0.1.0"
description = "MCP server exposing Lyrion Music Server (LMS) control over Streamable HTTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1",
    "httpx2>=2.5.0",
    "starlette>=0.48.0",
    "uvicorn>=0.31.1",
    "pydantic>=2.12.0",
]

[project.scripts]
lms-mcp = "lms_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lms_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["lms_mcp", "conftest", "helpers"]
